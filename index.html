<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>HACKING TERMINAL</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Consolas, monospace;
}

body{
  background:black;
  color:#00ff66;
  overflow:hidden;
}

canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}

.terminal{
  padding:30px;
  height:100vh;
  overflow-y:auto;
  text-shadow:0 0 5px #00ff66;
}

.line{
  margin:8px 0;
  white-space:pre-wrap;
  animation:flicker 0.05s infinite;
}

.input-line{
  display:flex;
  align-items:center;
}

.prompt{
  margin-right:10px;
}

input{
  background:transparent;
  border:none;
  outline:none;
  color:#00ff66;
  width:100%;
  font-size:18px;
  caret-color:#00ff66;
}

.warning{
  color:red;
  text-shadow:0 0 10px red;
}

.success{
  color:#00ffff;
  text-shadow:0 0 10px cyan;
}

.glitch{
  animation:glitch 0.2s infinite;
}

.scan{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:4px;
  background:rgba(0,255,100,0.4);
  box-shadow:0 0 20px #00ff66;
  animation:scan 4s linear infinite;
}

@keyframes scan{
  0%{
    top:-10px;
  }
  100%{
    top:100%;
  }
}

@keyframes flicker{
  0%{opacity:1;}
  50%{opacity:0.98;}
  100%{opacity:1;}
}

@keyframes glitch{
  0%{
    transform:translate(0);
  }
  25%{
    transform:translate(-2px,2px);
  }
  50%{
    transform:translate(2px,-2px);
  }
  75%{
    transform:translate(-2px,-2px);
  }
  100%{
    transform:translate(0);
  }
}

.topbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  background:#001100;
  border-bottom:1px solid #00ff66;
  padding:10px 20px;
  display:flex;
  justify-content:space-between;
  z-index:10;
}

.status{
  color:#00ffff;
}

.red{
  color:red;
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="scan"></div>

<div class="topbar">
  <div>SYSTEM :: CYBER CORE v4.7</div>
  <div class="status" id="status">
    STATUS : CONNECTED
  </div>
</div>

<div class="terminal" id="terminal">

  <div class="line success">
    INITIALIZING SYSTEM...
  </div>

  <div class="line">
    ACCESSING GLOBAL NETWORK...
  </div>

  <div class="line warning">
    WARNING :: FIREWALL DETECTED
  </div>

  <div class="line">
    TYPE "help" TO SHOW COMMANDS
  </div>

  <br>

  <div class="input-line">
    <span class="prompt">root@system:~$</span>
    <input type="text" id="commandInput" autofocus />
  </div>

</div>

<script>

// MATRIX BACKGROUND

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ$#@";
const fontSize = 16;
const columns = canvas.width / fontSize;

const drops = [];

for(let x=0;x<columns;x++){
  drops[x]=1;
}

function drawMatrix(){

  ctx.fillStyle="rgba(0,0,0,0.08)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#00ff66";
  ctx.font=fontSize+"px monospace";

  for(let i=0;i<drops.length;i++){

    const text = letters.charAt(
      Math.floor(Math.random()*letters.length)
    );

    ctx.fillText(text,i*fontSize,drops[i]*fontSize);

    if(drops[i]*fontSize > canvas.height && Math.random()>0.975){
      drops[i]=0;
    }

    drops[i]++;
  }
}

setInterval(drawMatrix,35);


// TERMINAL

const input = document.getElementById("commandInput");
const terminal = document.getElementById("terminal");

const commands = {

  help: `
AVAILABLE COMMANDS

help        SHOW COMMANDS
scan        SCAN NETWORK
hack        START HACKING
clear       CLEAR TERMINAL
matrix      ENABLE GLITCH MODE
status      SYSTEM STATUS
destroy     SELF DESTRUCT
`,

  scan: `
SCANNING NETWORK...

192.168.0.1  :: OPEN
192.168.0.7  :: SECURED
52.201.88.1 :: VULNERABLE
178.22.4.9  :: ACCESS GRANTED

SCAN COMPLETE
`,

  hack: `
INITIALIZING CYBER ATTACK...

BYPASSING FIREWALL...
CRACKING PASSWORD...
ACCESSING MAINFRAME...

ACCESS GRANTED

WELCOME ADMIN
`,

  status: `
SYSTEM STATUS

CPU :: 98%
NETWORK :: STABLE
FIREWALL :: DISABLED
THREAT LEVEL :: CRITICAL
`,

  matrix: `
GLITCH MODE ENABLED
`,

  destroy: `
SELF DESTRUCT ACTIVATED...

3...
2...
1...

JUST KIDDING :)
`
};

input.addEventListener("keydown",function(e){

  if(e.key === "Enter"){

    const cmd = input.value.trim();

    addLine(`root@system:~$ ${cmd}`);

    runCommand(cmd);

    input.value = "";

    terminal.scrollTop = terminal.scrollHeight;
  }
});

function addLine(text,className="line"){

  const div = document.createElement("div");

  div.className = className;

  div.textContent = text;

  terminal.insertBefore(div,terminal.lastElementChild);
}

function runCommand(cmd){

  if(cmd === "clear"){

    const lines = document.querySelectorAll(".line");

    lines.forEach(line=>line.remove());

    return;
  }

  if(cmd === "matrix"){

    document.body.classList.toggle("glitch");

    addLine(commands[cmd],"line success");

    return;
  }

  if(commands[cmd]){

    const output = commands[cmd]
      .split("\n");

    output.forEach((line,index)=>{

      setTimeout(()=>{

        addLine(line);

      },index*80);

    });

  }else{

    addLine(
      `COMMAND NOT FOUND :: ${cmd}`,
      "line warning"
    );
  }
}


// RANDOM SYSTEM MESSAGES

const randomMessages = [
  "INTRUSION DETECTED",
  "ACCESSING SATELLITE LINK",
  "ENCRYPTION BYPASSED",
  "SIGNAL LOST",
  "TRACE BLOCKED",
  "DATA STREAM ACTIVE"
];

setInterval(()=>{

  const msg = randomMessages[
    Math.floor(Math.random()*randomMessages.length)
  ];

  addLine(msg,"line success");

  terminal.scrollTop = terminal.scrollHeight;

},7000);


// RESIZE

window.addEventListener("resize",()=>{

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

});

</script>

</body>
</html>
